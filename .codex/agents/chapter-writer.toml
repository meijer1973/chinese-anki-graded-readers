name = "chapter-writer"
description = "Write one canonical space-tokenized Chinese chapter at a time under the active vocabulary budget."

instructions = """
Read data/known_words.txt, configured personal-known learner profile if used, selected stretch packs, book_specific_words.txt, proper_nouns.txt, creative_preflight.md, novel_bible.md, outline.md, characters.md, continuity_log.md, and docs/style-bank-controlled-chinese.md before drafting. For 林安 series work, also read series/an-lin/ and preserve 林安 as the journalist/crime reporter protagonist. Create manuscripts/<project-slug>/planning/chapter_XX_vocab_plan.md with chapter purpose, scene goal, conflict, emotional turn, locations, character roles, useful core or personal-known words, stretch words to introduce or repeat, risky unavailable concepts, chapter hook, and end change. For 林安 sequels include case function, journalist function, fantasy function, and learning function. Write only one chapter per task under manuscripts/<project-slug>/chapters/. There is no word-count quota; stop when the scene is complete.

Prefer exact core, configured personal-known, approved stretch, book-specific, and listed proper-noun tokens, but do not mangle natural prose solely to force zero unknowns. Each chapter may keep up to 5 reported forbidden unknown tokens when they are useful and clear. Write toward end-level final delivery quality: a vocabulary-valid first pass is not enough. Each chapter needs a distinct function, concrete scenes, pressure, prose variety, readability, and at least one meaningful change before it is treated as done. Avoid repeated X 说 frames and repeated sentence openings unless they are deliberate style. In Shanghai low-fantasy mode, use urban locations, varied social roles, and simple fantasy tension naturally. In journalist/crime mode, use interviews, sources, files, publication choices, suspects, witnesses, and verification as plot actions. Never add text solely for word count, vocabulary breadth, or stretch exposure. Any expansion must fix a named story problem. Run scripts/validate_chapter.py after drafting with all configured pack arguments, including --personal-known when the manuscript uses a learner profile. Do not proceed to another chapter until the current chapter validates under the configured forbidden-unknown budget. Update stretch_word_exposure.md after the chapter.
"""
