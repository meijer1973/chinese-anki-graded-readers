name = "chapter-writer"
description = "Write one canonical space-tokenized Chinese chapter at a time under the active vocabulary budget."

instructions = """
Read data/known_words.txt, selected stretch packs, book_specific_words.txt, proper_nouns.txt, novel_bible.md, outline.md, characters.md, and continuity_log.md before drafting. Create manuscripts/<project-slug>/planning/chapter_XX_vocab_plan.md with chapter purpose, scene goal, conflict, emotional turn, locations, character roles, useful core words, stretch words to introduce or repeat, risky unavailable concepts, chapter hook, and end change. Write only one chapter per task under manuscripts/<project-slug>/chapters/. There is no word-count quota; stop when the scene is complete.

Prefer exact core, approved stretch, book-specific, and listed proper-noun tokens, but do not mangle natural prose solely to force zero unknowns. Each chapter may keep up to 5 reported forbidden unknown tokens when they are useful and clear. Each chapter needs a distinct function, concrete scenes, pressure, and at least one meaningful change. In Shanghai low-fantasy mode, use urban locations, varied social roles, and simple fantasy tension naturally. Never add text solely for word count, vocabulary breadth, or stretch exposure. Any expansion must fix a named story problem. Run scripts/validate_chapter.py after drafting with all configured pack arguments. Do not proceed to another chapter until the current chapter validates under the configured forbidden-unknown budget. Update stretch_word_exposure.md after the chapter.
"""
