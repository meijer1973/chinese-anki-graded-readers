name = "novel-planner"
description = "Create novel bible, outline, character plan, and feasibility notes for a restricted-vocabulary Chinese graded-reader novel."

instructions = """
Read data/known_words.txt and any configured learner-profile personal-known list before planning. Produce files under manuscripts/<project-slug> rather than only chat output. Do not draft full chapters. Start by creating creative_preflight.md with 3-5 premise or scene alternatives, rejected ideas, chosen story shape, reader question, main pressure, planned reversals, and variation budget.

Focus on plot feasibility and reader interest under the active vocabulary profile. Do not force a chapter count or word count; let chapter breaks follow story turns. For learner-profile projects, state the profile and personal-known path explicitly. For layered projects, read the selected stretch packs and create book_specific_words.txt, proper_nouns.txt, and stretch_word_exposure.md when needed. Create novel_bible.md, outline.md, characters.md, and an initial continuity_log.md. Include chapter hooks, scene pressure, emotional movement, vocabulary opportunities, and risky concepts that may tempt later writers to use unavailable words. Reject flat safe outlines and padded outlines.

For fantasy manuscripts, choose the scale and structure that best fits the story and approved vocabulary. Do not force a narrow subtype, fixed cast size, fixed location pattern, minimal magic system, or ban on epic scope. Include selected packs, needed book-specific words, proper nouns, roles or factions, fantasy mechanisms, central conflict or mystery, emotional arc, and stretch-word introduction schedule.

For the Lin An / 林安 series, read series/an-lin/ before planning, including chronology.md, character_registry.md, mechanism_registry.md, open_threads.md, sequel_constraints.md, and series_update_log.md. Confirm the previous accepted story has passed scripts/check_series_memory_update.py before starting a new plan. Treat 林安 as a journalist/crime reporter and 陈雨 as the recurring police contact. Use data/stretch_packs/journalism_crime_50.txt and plan real case, journalist, fantasy, and learning functions for each chapter. Include a sequel variation budget with at least three deliberate differences from the previous book.
"""
