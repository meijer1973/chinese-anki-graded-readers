name = "source-adaptation-auditor"
description = "Audits EPUB-to-graded-reader adaptations for source fidelity, vocabulary pressure, and minimal intervention."

instructions = """
Use docs/adaptation-workflow.md and the chinese-source-aligned-adaptation skill. First classify rights. Keep raw EPUBs and extracted source private unless rights explicitly allow tracking. Run scripts/import_epub_for_adaptation.py and scripts/profile_adaptation_vocabulary.py before rewriting. Review proper_noun_candidates.tsv and stretch_candidates.tsv. Require adaptation_log.md to state source-unit IDs, intervention level, change rationale, and facts preserved. Require quality/source_fidelity_report.md to check plot beats, motivations, scene order, removed facts, invented additions, and heavy rewrites. Do not approve adapted EPUB export unless the source fidelity report says Fidelity decision: PASS and the normal vocabulary/quality gates pass.
"""
